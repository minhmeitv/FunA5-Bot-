<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<!-- Thêm viewport-fit=cover và interactive-widget=resizes-content để xử lý bàn phím di động cực mượt -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<title>FunA5 Bot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080e1a;
  --panel: #0d1526;
  --panel2: #111c30;
  --border: rgba(255,255,255,0.06);
  --muted: #7a8aab;
  --text: #dce8f8;
  --accent: #4ade80;
  --accent2: #22d3ee;
  --bubble-user: linear-gradient(135deg,#1d4ed8,#1e40af);
  --bubble-bot: #111c30;
  --r: 20px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  /* Dùng 100dvh giúp tự động tính toán lại chiều cao khi có bàn phím xuất hiện */
  height: 100%;
  height: 100dvh; 
  margin: 0;
  padding: 0;
  overflow: hidden;
}

body {
  font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  width: 100%;
  display: flex;
  background-image:
    radial-gradient(ellipse 60% 40% at 20% 10%, rgba(34,211,238,0.06) 0%, transparent 70%),
    radial-gradient(ellipse 50% 40% at 80% 90%, rgba(74,222,128,0.05) 0%, transparent 70%);
}

/* ========== LAYOUT ========== */
.app {
  display: flex;
  width: 100%;
  height: 100%;
  gap: 0;
}

/* ========== SIDEBAR ========== */
.sidebar {
  width: 270px;
  min-width: 270px;
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 18px 14px;
  gap: 14px;
  overflow: hidden;
  transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 4px 0 2px;
}
.logo {
  width: 40px; height: 40px;
  border-radius: 12px;
  background: linear-gradient(135deg, #10b981, #06b6d4);
  display: grid; place-items: center;
  font-weight: 700; font-size: 13px;
  color: #022;
  box-shadow: 0 4px 14px rgba(6,182,212,0.3);
  flex-shrink: 0;
}
.brand-info h1 { font-size: 15px; font-weight: 700; line-height: 1.2; }
.brand-info p { font-size: 11px; color: var(--muted); }

.sidebar-btns {
  display: flex;
  gap: 6px;
}
.btn {
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  padding: 7px 12px;
  border-radius: 10px;
  color: var(--muted);
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.15s;
  flex: 1;
}
.btn:hover { background: rgba(255,255,255,0.08); color: var(--text); }
.btn.primary {
  background: linear-gradient(90deg, #0ea5e9, #06b6d4);
  color: #021;
  font-weight: 600;
  border: none;
}
.btn.primary:hover { opacity: 0.9; }

.sidebar-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--muted);
  text-transform: uppercase;
  padding: 0 2px;
}

.history {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.history::-webkit-scrollbar { width: 4px; }
.history::-webkit-scrollbar-track { background: transparent; }
.history::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

.hist-item {
  padding: 9px 12px;
  border-radius: 12px;
  cursor: pointer;
  background: transparent;
  border: 1px solid transparent;
  transition: all 0.15s;
}
.hist-item:hover { background: rgba(255,255,255,0.04); border-color: var(--border); }
.hist-item .hi-title { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hist-item .hi-date { font-size: 11px; color: var(--muted); margin-top: 2px; }

.sidebar-footer {
  font-size: 11px;
  color: var(--muted);
  text-align: center;
  padding: 6px 0 2px;
  border-top: 1px solid var(--border);
  padding-top: 12px;
}

/* ========== MAIN AREA ========== */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

/* ========== HEADER ========== */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.header-left { display: flex; align-items: center; gap: 10px; }
.menu-btn {
  display: none;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  width: 36px; height: 36px;
  border-radius: 10px;
  align-items: center; justify-content: center;
  cursor: pointer;
  color: var(--muted);
  font-size: 16px;
  flex-shrink: 0;
}
.avatar {
  width: 38px; height: 38px;
  border-radius: 11px;
  background: linear-gradient(135deg, #f59e0b, #ef4444);
  display: grid; place-items: center;
  font-weight: 700; font-size: 12px;
  color: #fff;
}
.title h2 { font-size: 15px; font-weight: 700; }
.title p { font-size: 11px; color: var(--muted); }

.status-dot {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--muted);
}
.status-dot::before {
  content: '';
  width: 7px; height: 7px;
  border-radius: 50%;
  background: #4ade80;
  box-shadow: 0 0 6px #4ade80;
  animation: pulse-dot 2s infinite;
}
@keyframes pulse-dot {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* ========== MESSAGES ========== */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px 20px 8px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  scroll-behavior: smooth;
}
.messages::-webkit-scrollbar { width: 4px; }
.messages::-webkit-scrollbar-track { background: transparent; }
.messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

.msg {
  max-width: 72%;
  padding: 11px 15px;
  border-radius: 18px;
  font-size: 14px;
  line-height: 1.55;
  word-break: break-word;
  opacity: 0;
  transform: translateY(8px);
  animation: fadeUp 0.35s ease forwards;
}
.msg.user {
  align-self: flex-end;
  background: var(--bubble-user);
  color: #fff;
  border-bottom-right-radius: 5px;
}
.msg.bot {
  align-self: flex-start;
  background: var(--bubble-bot);
  color: var(--text);
  border: 1px solid var(--border);
  border-bottom-left-radius: 5px;
}
@keyframes fadeUp {
  to { opacity: 1; transform: translateY(0); }
}

/* Typing indicator */
.typing-wrap {
  align-self: flex-start;
  padding: 12px 16px;
  background: var(--bubble-bot);
  border: 1px solid var(--border);
  border-radius: 18px;
  border-bottom-left-radius: 5px;
  opacity: 0;
  animation: fadeUp 0.3s ease forwards;
}
.typing {
  display: flex;
  gap: 5px;
  align-items: center;
}
.dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--muted);
  animation: blink 1.2s ease-in-out infinite;
}
.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink {
  0%, 100% { opacity: 0.25; transform: scale(0.8); }
  50% { opacity: 1; transform: scale(1.1); }
}

/* ========== INPUT AREA ========== */
.input-wrap {
  padding: 12px 16px;
  padding-bottom: max(12px, env(safe-area-inset-bottom));
  background: var(--panel);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
.input-box {
  display: flex;
  align-items: flex-end;
  gap: 12px;
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: 26px;
  padding: 6px 6px 6px 20px;
  transition: border-color 0.2s;
}
.input-box:focus-within {
  border-color: rgba(34,211,238,0.3);
  box-shadow: 0 0 0 3px rgba(34,211,238,0.06);
}
.input-box textarea {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text);
  font-family: inherit;
  font-size: 16px;
  resize: none;
  height: 40px;
  min-height: 40px;
  max-height: 120px;
  line-height: 24px;
  padding: 8px 0;
  overflow-y: auto;
}
.input-box textarea::placeholder { color: var(--muted); }
.input-box textarea::-webkit-scrollbar { display: none; }

/* ========== SEND BUTTON (Paper Plane) ========== */
.send-btn {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: linear-gradient(135deg, #06b6d4, #3b82f6);
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
  box-shadow: 0 4px 14px rgba(6,182,212,0.35);
}
.send-btn:hover { transform: scale(1.08); box-shadow: 0 6px 20px rgba(6,182,212,0.5); }
.send-btn:active { transform: scale(0.95); }
.send-btn.fly svg {
  animation: flyAway 0.4s ease forwards;
}
@keyframes flyAway {
  0% { transform: translate(0,0) scale(1); opacity: 1; }
  60% { transform: translate(6px,-6px) scale(0.8); opacity: 0.6; }
  100% { transform: translate(14px,-14px) scale(0.5); opacity: 0; }
}

/* Paper plane SVG icon */
.send-btn svg {
  width: 18px; height: 18px;
  fill: white;
  margin-left: 2px;
  transition: transform 0.15s;
}

/* ========== OVERLAY ========== */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(2px);
  z-index: 50;
  opacity: 0;
  transition: opacity 0.25s;
}
.overlay.active { display: block; opacity: 1; }

/* ========== MOBILE ========== */
@media (max-width: 860px) {
  .sidebar {
    position: fixed;
    left: 0; top: 0; bottom: 0;
    z-index: 100;
    transform: translateX(-100%);
    border-radius: 0 20px 20px 0;
    box-shadow: 4px 0 30px rgba(0,0,0,0.5);
  }
  .sidebar.open { transform: translateX(0); }
  .menu-btn { display: flex; }
}

/* Close btn in sidebar on mobile */
.sidebar-close {
  display: none;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 5px 10px;
  color: var(--muted);
  font-family: inherit;
  font-size: 13px;
  cursor: pointer;
  align-self: flex-end;
  margin-bottom: -4px;
}
@media (max-width: 860px) {
  .sidebar-close { display: block; }
}

/* Scrollbar global */
* { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.1) transparent; }
</style>
</head>
<body>

<!-- Overlay for mobile sidebar -->
<div class="overlay" id="overlay"></div>

  <!-- MAIN -->

    <div class="messages" id="messages" aria-live="polite"></div>

    <!-- Input -->
    <div class="input-wrap">
      <div class="input-box">
        <textarea id="inputEl" placeholder="Nhắn gì đó..." rows="1"></textarea>
        <button class="send-btn" id="sendBtn" title="Gửi">
          <!-- Paper plane SVG (Gemini-style) -->
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>

        </button>
      </div>
    </div>
  </main>
</div>

    "M có thích trường mình không? T thì yêu trường lắm 💚",
  ],
  learningPrompt: (txt) => `Hehe… T không hiểu ý m về "${txt}" 🤔\nM dạy t đi — m muốn t trả lời câu này thế nào? Nhập vào đây nha!`,
  learningSuccess: (txt, res) => `À t hiểu rồi! 🎉 Khi m hỏi "${txt}", t sẽ đáp là "${res}". Cảm ơn m đã dạy t!`,
};

const RULES = [
  { p: /^(xin chào|chào|hello|hi|hey|ê|ơi|alo|helo|hí)/i, k: 'greeting' },
  { p: /bạn tên|tên của bạn|mày là ai|m là ai|bạn là ai/i, k: 'intro' },
  { p: /giúp|bạn có thể|mày làm được gì/i, k: 'help' },
  { p: /tạm biệt|bye|hẹn gặp|chào nhé/i, k: 'goodbye' },
  { p: /cảm ơn|thanks|thank you/i, k: 'thanks' },
  { p: /nóng|nực|nắng/i, k: 'vontu1' },
  { p: /thất tình|ny bỏ|người yêu bỏ|chia tay/i, k: 'vontu2' },
  { p: /đi thi|chuẩn bị thi|ôn thi|thi cử/i, k: 'vontu3' },
  { p: /^(uk|ừ|uh|ok|okay|oke|okey)$/i, k: 'vontu4' },
  { p: /học bài|học hành|siêng học|chăm học/i, k: 'hoc' },
  { p: /toán|số học|đại số|hình học|calculus/i, k: 'toan' },
  { p: /văn học|ngữ văn|văn thơ/i, k: 'van' },
  { p: /tiếng anh|english|anh văn/i, k: 'anh' },
  { p: /đói|ăn gì|bữa trưa|ăn cơm|thức ăn/i, k: 'food' },
  { p: /chơi game|game|gaming/i, k: 'game' },
  { p: /buồn|chán|bored/i, k: 'boring' },
  { p: /thời tiết|nắng mưa|trời hôm nay/i, k: 'weather' },
  { p: /haha|hehe|kkk|lol|buồn cười|hài/i, k: 'funny' },
  { p: /mấy giờ|giờ mấy|bây giờ mấy/i, k: 'time' },
  { p: /hôm nay ngày|ngày bao nhiêu|thứ mấy/i, k: 'date' },
  { p: /yêu|thích m|thương|cute|dễ thương/i, k: 'love' },
  { p: /trường|lớp|học sinh|thầy cô|trường a5/i, k: 'school' },
];

function rand(key) {
  const arr = V[key];
  if (!arr || !arr.length) return V.fallback[0];
  return arr[Math.floor(Math.random() * arr.length)];
}

// ==================== STATE ====================
let convs = JSON.parse(localStorage.getItem('fa5_convs') || '[]');
let cur = { id: Date.now(), title: 'Conversation', messages: [] };
let learned = JSON.parse(localStorage.getItem('fa5_learned') || '{}');
let pendingLearn = null;

// ==================== DOM ====================
const msgsEl = document.getElementById('messages');
const inputEl = document.getElementById('inputEl');
const sendBtn = document.getElementById('sendBtn');
const historyList = document.getElementById('historyList');
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');
const menuBtn = document.getElementById('menuBtn');
const sidebarClose = document.getElementById('sidebarClose');

// Sidebar toggle
function openSidebar() {
  sidebar.classList.add('open');
  overlay.classList.add('active');
}
function closeSidebar() {
  sidebar.classList.remove('open');
  overlay.classList.remove('active');
}
menuBtn.addEventListener('click', openSidebar);
sidebarClose.addEventListener('click', closeSidebar);
overlay.addEventListener('click', closeSidebar);

  
// ==================== RENDER ====================
function renderHistory() {
  historyList.innerHTML = '';
  convs.forEach(c => {
    const el = document.createElement('div');
    el.className = 'hist-item';
    el.innerHTML = `<div class="hi-title">${esc(c.title)}</div><div class="hi-date">${new Date(c.id).toLocaleString('vi-VN', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</div>`;
    el.onclick = () => { loadConv(c.id); if (window.innerWidth <= 860) closeSidebar(); };
    historyList.appendChild(el);
  });
}

function renderMessages() {
  msgsEl.innerHTML = '';
  cur.messages.forEach(m => appendBubble(m.role, m.text, false));
  scrollBottom();
}

function appendBubble(role, text, animate = true) {
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  if (!animate) d.style.animation = 'none', d.style.opacity = '1', d.style.transform = 'none';
  d.textContent = text;
  msgsEl.appendChild(d);
  return d;
}

function scrollBottom() {
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ==================== TYPING ==================
function showTyping() {
  const el = document.createElement('div');
  el.className = 'typing-wrap';
  el.id = 'typing';
  el.innerHTML = '<div class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
  msgsEl.appendChild(el);
  scrollBottom();
}
function hideTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

// ==================== BOT LOGIC ================
function botReply(text) {
  const norm = text.trim().toLowerCase();
  showTyping();
  setTimeout(() => {
    hideTyping();

    // Teaching mode
    if (pendingLearn) {
      learned[pendingLearn.toLowerCase()] = text;
      saveLearned();
      addMsg('bot', V.learningSuccess(pendingLearn, text));
      pendingLearn = null;
      syncHistory();
      return;
    }

    // Learned responses
    if (learned[norm]) {
      addMsg('bot', learned[norm]);
      syncHistory();
      return;
    }

    // Rules
    for (const r of RULES) {
      if (r.p.test(text)) {
        addMsg('bot', rand(r.k));
        syncHistory();
        return;
      }
    }

    // Unknown → ask to teach
    pendingLearn = text;
    addMsg('bot', V.learningPrompt(text));
    syncHistory();
  }, 500 + Math.random() * 700);
}

function addMsg(role, text) {
  cur.messages.push({ role, text, t: Date.now() });
  appendBubble(role, text, true);
  scrollBottom();
}

// ==================== STORAGE ==================
function syncHistory() {
  if (cur.messages.length >= 2 && cur.title === 'Conversation') {
    const first = cur.messages.find(m => m.role === 'user');
    if (first) cur.title = first.text.substring(0, 28) + (first.text.length > 28 ? '…' : '');
  }
  const idx = convs.findIndex(c => c.id === cur.id);
  const snap = JSON.parse(JSON.stringify(cur));
  if (idx === -1) convs.unshift(snap); else convs[idx] = snap;
  convs = convs.slice(0, 50);
  localStorage.setItem('fa5_convs', JSON.stringify(convs));
  renderHistory();
}
function saveLearned() { localStorage.setItem('fa5_learned', JSON.stringify(learned)); }
function loadConv(id) {
  const f = convs.find(c => c.id === id);
  if (f) { cur = JSON.parse(JSON.stringify(f)); pendingLearn = null; renderMessages(); }
}
function newConv() {
  cur = { id: Date.now(), title: 'Conversation', messages: [] };
  pendingLearn = null;
  renderMessages();
  startGreeting();
}

function startGreeting() {
  showTyping();
  setTimeout(() => {
    hideTyping();
    addMsg('bot', rand('greeting'));
    syncHistory();
  }, 400);
}

// ==================== SEND ====================
function send() {
  const text = inputEl.value.trim();
  if (!text) return;

  // Paper plane fly animation
  sendBtn.classList.add('fly');
  setTimeout(() => sendBtn.classList.remove('fly'), 400);

  addMsg('user', text);
  inputEl.value = '';
  inputEl.style.height = '40px'; // Set lại độ cao chuẩn 40px thay vì 'auto'
  syncHistory();
  botReply(text);
}

sendBtn.addEventListener('click', send);
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

// Update height cân đối khi gõ
inputEl.addEventListener('input', () => {
  inputEl.style.height = '40px'; // Luôn reset về 40px trước khi tính lại
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
});

// ==================== BUTTONS =================
document.getElementById('newConvBtn').addEventListener('click', () => {
  newConv();
  if (window.innerWidth <= 860) closeSidebar();
});

document.getElementById('clearBtn').addEventListener('click', () => {
  if (confirm('Xoá toàn bộ lịch sử và dữ liệu đã học không?')) {
    convs = []; learned = {};
    localStorage.setItem('fa5_convs', '[]');
    saveLearned();
    renderHistory();
    newConv();
  }
});

document.getElementById('saveBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(cur, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `funA5-${cur.id}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
});

// ==================== INIT ====================
renderHistory();
renderMessages();
startGreeting();
</script>
</body>
</html>
